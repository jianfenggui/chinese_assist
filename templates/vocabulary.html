<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>词汇助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>词汇助手</h1>

    <form action="/vocabulary" method="post">
        <input type="text" name="words" placeholder="输入词汇，用空格分隔">
        <input type="submit" value="提交词汇">
    </form>

    <h2>词汇列表</h2>
    <div id="vocabulary-list">
        {% if words %}
            <ul>
                {% for word in words %}
                    <li class="vocab-word">{{ word }} <button class="explain-button" data-word="{{ word }}" onclick="handleExplainWord(this.dataset.word)">Explain</button></li>
                {% endfor %}
            </ul>
        {% else %}
            <p>暂无词汇，请通过上方表单添加。</p>
        {% endif %}
    </div>

    <div id="explanation-area">
        Word explanations will appear here.
    </div>

    <button id="dictate-button">听写</button>

    <script>
        async function handleExplainWord(word) {
            console.log("Explain word:", word);
            const explanationArea = document.getElementById('explanation-area');
            if (!explanationArea) {
                console.error("Explanation area not found!");
                return;
            }
            explanationArea.innerHTML = 'Fetching explanation...'; // Indicate loading

            const apiKey = "AIzaSyBiPSZpw3anpuGCQ4OHJIFt3OokmG22RG4";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;

            const requestBody = {
                "contents": [{
                    "parts": [{
                        "text": "Explain the word: " + word + ". Keep the explanation concise and suitable for a language learner."
                    }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    console.error("API request failed:", response.status, await response.text());
                    explanationArea.innerHTML = "Sorry, there was an error communicating with the explanation service.";
                    return;
                }

                const data = await response.json();

                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) {
                    const explanation = data.candidates[0].content.parts[0].text;
                    explanationArea.innerHTML = explanation;
                } else {
                    console.error("Invalid API response structure:", data);
                    explanationArea.innerHTML = "Sorry, I couldn't find an explanation for this word.";
                }

            } catch (error) {
                console.error("Error during API call:", error);
                explanationArea.innerHTML = "Sorry, an unexpected error occurred while fetching the explanation.";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const dictateButton = document.getElementById('dictate-button');
            
            if (dictateButton) {
                dictateButton.addEventListener('click', () => {
                    const wordElements = document.querySelectorAll('.vocab-word');
                    const wordsArray = Array.from(wordElements).map(el => el.textContent.trim());

                    if (!wordsArray.length) {
                        alert('请先添加词汇。');
                        return;
                    }

                    if (!window.speechSynthesis) {
                        alert('您的浏览器不支持语音合成功能。');
                        console.log('Speech synthesis not supported.');
                        return;
                    }

                    function speakWords(words, index) {
                        if (index >= words.length) {
                            // Optional: Announce completion
                            const completionUtterance = new SpeechSynthesisUtterance("听写结束");
                            completionUtterance.lang = 'zh-CN';
                            window.speechSynthesis.speak(completionUtterance);
                            return;
                        }

                        const utterance = new SpeechSynthesisUtterance(words[index]);
                        utterance.lang = 'zh-CN';
                        
                        // Ensure previous utterance is cleared before speaking next one
                        // and handle potential errors or interruptions.
                        utterance.onend = () => {
                            setTimeout(() => {
                                speakWords(words, index + 1);
                            }, 5000); // 5 seconds delay
                        };
                        
                        utterance.onerror = (event) => {
                            console.error('SpeechSynthesisUtterance.onerror', event);
                            // Optionally, try to continue with the next word or stop
                            setTimeout(() => {
                                speakWords(words, index + 1); // Try next word even if current fails
                            }, 5000);
                        };
                        
                        window.speechSynthesis.speak(utterance);
                    }

                    // Cancel any ongoing speech before starting a new dictation
                    window.speechSynthesis.cancel(); 
                    speakWords(wordsArray, 0);
                });
            } else {
                console.error('Dictate button not found.');
            }
        });
    </script>
</body>
</html>
