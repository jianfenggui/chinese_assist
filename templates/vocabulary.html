<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>词汇助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>词汇助手</h1>

    <div class="input-section-wrapper">
        <form action="/vocabulary" method="post" class="vocabulary-form">
            <input type="text" name="words" placeholder="输入词汇，用空格分隔" class="large-input">
            <input type="submit" value="提交词汇">
        </form>

        <div id="image-recognition-section" style="margin-top: 20px;">
            <h3>或从图片识别词汇</h3>
            <input type="file" id="image_file_input" accept="image/*">
            <button type="button" id="recognize_image_button">从图片识别词汇</button>
            <p id="image_recognition_status" style="margin-top: 10px;"></p>
        </div>
    </div>

    <h2>词汇列表</h2>
    <div id="vocabulary-list">
        {% if words %}
            {% for word in words %}
                <span class="vocab-word-item">{{ word }}</span>
            {% endfor %}
        {% else %}
            <p>暂无词汇，请通过上方表单添加。</p>
        {% endif %}
    </div>

    <div id="explanation-area">
        Word explanations will appear here.
    </div>

    <div> <!-- Wrapper for dictation buttons -->
        <button id="dictate-button">听写</button>
        <button id="pause-resume-button" style="display: none;">暂停</button> <!-- Initially hidden -->
        <button id="global-explain-button">解释当前词汇</button> 
    </div>

    <script>
        let isDictationPaused = false; 

        document.addEventListener('DOMContentLoaded', () => {
            const dictateButton = document.getElementById('dictate-button');
            const pauseResumeButton = document.getElementById('pause-resume-button');
            const globalExplainButton = document.getElementById('global-explain-button');
            const explanationArea = document.getElementById('explanation-area'); 
            const imageFileInput = document.getElementById('image_file_input');
            const recognizeImageButton = document.getElementById('recognize_image_button');
            const imageRecognitionStatus = document.getElementById('image_recognition_status');
            const wordsInput = document.querySelector('input[name="words"]');

            let currentWordsArray = [];
            let currentWordIndex = 0;
            let currentDictationWord = null; // Variable to store the currently dictated word

            async function handleExplainWord() { // Removed 'word' parameter
                if (!explanationArea) {
                    console.error("Explanation area not found!");
                    return;
                }

                if (!currentDictationWord) {
                    explanationArea.innerHTML = "No word is currently selected for explanation.";
                    console.log("handleExplainWord called but currentDictationWord is null or empty.");
                    return;
                }

                console.log("Explain current word:", currentDictationWord);
                explanationArea.innerHTML = 'Fetching explanation...'; // Indicate loading

                const apiKey = "AIzaSyBiPSZpw3anpuGCQ4OHJIFt3OokmG22RG4"; // Consider moving API key to a more secure place or server-side if possible
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

                const requestBody = {
                    "contents": [{
                        "parts": [{
                            "text": "解释词语: " + currentDictationWord + ". 请用一句话，最简洁的语言解释。比如北京，中国的首都。"
                        }]
                    }]
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        console.error("API request failed:", response.status, await response.text());
                        explanationArea.innerHTML = "Sorry, there was an error communicating with the explanation service.";
                        return;
                    }

                    const data = await response.json();

                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) {
                        const explanation = data.candidates[0].content.parts[0].text;
                        explanationArea.innerHTML = explanation;
                    } else {
                        console.error("Invalid API response structure:", data);
                        explanationArea.innerHTML = "Sorry, I couldn't find an explanation for this word.";
                    }

                } catch (error) {
                    console.error("Error during API call:", error);
                    explanationArea.innerHTML = "Sorry, an unexpected error occurred while fetching the explanation.";
                }
            }

            if (globalExplainButton) {
                globalExplainButton.addEventListener('click', handleExplainWord);
            }


            function resetDictationState() {
                isDictationPaused = false;
                if(pauseResumeButton) {
                    pauseResumeButton.textContent = 'Pause';
                    pauseResumeButton.style.display = 'none';
                }
                currentWordsArray = []; // Ensure currentWordsArray is cleared
                currentWordIndex = 0;
                currentDictationWord = null; 
            }

            if (pauseResumeButton) {
                pauseResumeButton.addEventListener('click', () => {
                    if (!window.speechSynthesis) {
                        console.log('Speech synthesis not supported.');
                        resetDictationState(); // Reset UI if speech is not supported
                        return;
                    }

                    if (isDictationPaused) {
                        // 恢复
                        isDictationPaused = false;
                        pauseResumeButton.textContent = '暂停';
                        console.log('[PAUSE/RESUME] 点击Resume，直接调用speakNextWord，isDictationPaused:', isDictationPaused, 'speaking:', window.speechSynthesis.speaking, 'paused:', window.speechSynthesis.paused);
                        speakNextWord();
                    } else {
                        // 暂停：取消当前语音，阻止后续朗读
                        isDictationPaused = true;
                        window.speechSynthesis.cancel();
                        pauseResumeButton.textContent = '继续';
                        console.log('[PAUSE/RESUME] 点击Pause，调用window.speechSynthesis.cancel()，isDictationPaused:', isDictationPaused, 'speaking:', window.speechSynthesis.speaking, 'paused:', window.speechSynthesis.paused);
                    }
                });
            }
            if (dictateButton) {
                dictateButton.addEventListener('click', () => {
                    // Basic checks
                    if (!window.speechSynthesis) {
                        alert('您的浏览器不支持语音合成功能。');
                        console.log('Speech synthesis not supported.');
                        return;
                    }

                    window.speechSynthesis.cancel(); // 1. Stop any previous speech
                    resetDictationState();           // 2. Reset state variables (currentWordsArray is now empty)

                    const wordElements = document.querySelectorAll('.vocab-word-item'); // 3. Get words from DOM
                    currentWordsArray = Array.from(wordElements).map(el => {    //    Repopulate currentWordsArray
                        return el.textContent.trim();
                    }).filter(word => word);

                    if (!currentWordsArray.length) { // 4. Check if currentWordsArray is empty
                        alert('请先添加词汇。');
                        return; // No words to speak
                    }
                    
                    // 5. isDictationPaused is false (from resetDictationState)
                    // 6. currentWordIndex is 0 (from resetDictationState)

                    if (pauseResumeButton) { // 7. Update UI for pauseResumeButton
                        pauseResumeButton.style.display = 'inline-block';
                        pauseResumeButton.textContent = '暂停';
                    }
                    
                    speakNextWord(); // 8. Start dictation sequence
                });
            } else {
                console.error('Dictate button not found.');
            }

            function speakNextWord() {
                console.log('[DICTATION] speakNextWord called, isDictationPaused:', isDictationPaused, 'currentWordIndex:', currentWordIndex, 'wordsArray:', currentWordsArray, 'speaking:', window.speechSynthesis.speaking, 'paused:', window.speechSynthesis.paused);
                // If paused, do not proceed to speak. Wait for resume.
                if (isDictationPaused) {
                    console.log('[DICTATION] 暂停状态，speakNextWord直接return');
                    return;
                }

                if (currentWordIndex >= currentWordsArray.length) {
                    // All words have been processed
                    if (!window.speechSynthesis.speaking) { // Ensure no other speech (like the word itself) is active
                        const completionUtterance = new SpeechSynthesisUtterance("听写结束");
                        completionUtterance.lang = 'zh-CN';
                        completionUtterance.onend = resetDictationState; // Reset after "听写结束"
                        console.log('[DICTATION] 所有单词播报完毕，播报"听写结束"');
                        window.speechSynthesis.speak(completionUtterance);
                    } else {
                        // If still speaking, the onend of the current word will handle this.
                        console.log('[DICTATION] 所有单词播报完毕，但仍在speaking，等待onend触发');
                    }
                    return;
                }

                currentDictationWord = currentWordsArray[currentWordIndex]; // Update current dictation word
                const utterance = new SpeechSynthesisUtterance(currentDictationWord);
                utterance.lang = 'zh-CN';
                console.log('[DICTATION] 开始播报单词：', currentDictationWord, 'index:', currentWordIndex);
                
                utterance.onend = () => {
                    console.log('[DICTATION] onend触发，isDictationPaused:', isDictationPaused, 'currentWordIndex:', currentWordIndex);
                    if (isDictationPaused) { 
                        // If paused, onend might fire. Do nothing, wait for resume.
                        console.log('[DICTATION] onend时处于暂停状态，等待resume');
                        return; 
                    }
                    currentWordIndex++;
                    // Check if there are more words or if it's the end
                    if (currentWordIndex < currentWordsArray.length) {
                        setTimeout(() => {
                            if (!isDictationPaused) {
                                console.log('[DICTATION] 延迟后继续播报下一个单词');
                                speakNextWord();
                            } else {
                                console.log('[DICTATION] 延迟后发现已暂停，不继续播报');
                            }
                        }, 5000); // Delay before next word
                    } else {
                        // Last word has been spoken, announce completion
                        const completionUtterance = new SpeechSynthesisUtterance("听写结束");
                        completionUtterance.lang = 'zh-CN';
                        completionUtterance.onend = resetDictationState; // Reset after "听写结束"
                        console.log('[DICTATION] 最后一个单词播报完毕，播报"听写结束"');
                        window.speechSynthesis.speak(completionUtterance);
                    }
                };
                
                utterance.onerror = (event) => {
                    console.error('[DICTATION] SpeechSynthesisUtterance.onerror', event);
                    resetDictationState(); // Reset state on any speech error
                };
                
                // Check if already speaking before trying to speak.
                // This is a safeguard, though cancel() should handle it.
                if (!window.speechSynthesis.speaking || window.speechSynthesis.paused) {
                     console.log('[DICTATION] speakNextWord实际调用speak:', currentDictationWord);
                     window.speechSynthesis.speak(utterance);
                } else {
                    // This case should ideally be handled by the overall state logic
                    console.log("[DICTATION] Speech synthesis busy, utterance for '"+ currentWordsArray[currentWordIndex] +"' not spoken immediately.");
                }
            }

            // Image Recognition Logic
            if (recognizeImageButton) {
                recognizeImageButton.addEventListener('click', async () => {
                    if (!imageFileInput || !imageRecognitionStatus || !wordsInput) {
                        console.error('One or more UI elements for image recognition are missing.');
                        if(imageRecognitionStatus) imageRecognitionStatus.textContent = 'Error: UI elements missing. Please refresh.';
                        return;
                    }

                    const imageFile = imageFileInput.files[0];
                    console.log('Image file selected:', imageFile);

                    if (!imageFile) {
                        imageRecognitionStatus.textContent = 'Please select an image file.';
                        console.log('No image file selected.');
                        return;
                    }

                    imageRecognitionStatus.textContent = 'Recognizing...';
                    console.log('Starting image recognition...');

                    const formData = new FormData();
                    formData.append('image_file', imageFile);

                    try {
                        console.log('Sending fetch request to /recognize_image_with_gemini');
                        const response = await fetch('/recognize_image_with_gemini', {
                            method: 'POST',
                            body: formData
                        });

                        console.log('Received response from server:', response);

                        if (response.ok) {
                            const data = await response.json();
                            console.log('Parsed JSON response:', data);
                            if (data.recognized_text) {
                                wordsInput.value = data.recognized_text; // Populate the main vocabulary input
                                imageRecognitionStatus.textContent = 'Recognition complete.';
                                console.log('Recognition successful. Text populated.');
                            } else if (data.error) {
                                imageRecognitionStatus.textContent = 'Error: ' + data.error;
                                console.error('Recognition error from server:', data.error);
                            } else {
                                imageRecognitionStatus.textContent = 'Recognition complete, but no text found.';
                                console.log('Recognition complete, but no text found in response.');
                            }
                        } else {
                            let errorMsg = 'Recognition failed. Server returned: ' + response.status;
                            try {
                                const errorData = await response.json();
                                errorMsg = 'Error: ' + (errorData.error || errorData.details || 'Recognition failed.');
                                console.error('Server error data:', errorData);
                            } catch (e) {
                                console.error('Could not parse error JSON:', e);
                            }
                            imageRecognitionStatus.textContent = errorMsg;
                            console.error('Recognition request failed with status:', response.status);
                        }
                    } catch (error) {
                        imageRecognitionStatus.textContent = 'Error: An unexpected error occurred. Check console.';
                        console.error('Fetch API call failed:', error);
                    }
                });
            } else {
                console.error('Recognize image button not found.');
            }

        });
    </script>
</body>
</html>
